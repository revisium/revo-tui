sonar.projectKey=revisium_revo-tui
sonar.organization=revisium
sonar.projectName=revo-tui
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,.scannerwork/**,.sonar/**,pnpm-lock.yaml

# The TUI intentionally has no automated tests at this stage.
sonar.coverage.exclusions=**/*

# GraphQL Code Generator repeats shared schema structures in these outputs.
sonar.cpd.exclusions=src/modules/agent-configurations/transport/graphql/__generated__/typed-document-nodes.ts,src/modules/dialogue-engine/transport/graphql/__generated__/graphql-request.ts,src/modules/dialogue-engine/transport/graphql/__generated__/typed-document-nodes.ts

# OpenTUI components use native terminal props, not DOM props.
sonar.issue.ignore.multicriteria=opentuiAppProps,opentuiKeyboardProps,opentuiAgentSelectorProps,opentuiDialogueListProps,opentuiAppScreenProps,opentuiDialoguePageProps,opentuiDialogueHistoryProps,opentuiInteractionPanelProps,opentuiQuestionInputProps
sonar.issue.ignore.multicriteria.opentuiAppProps.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.opentuiAppProps.resourceKey=src/app/App.tsx
sonar.issue.ignore.multicriteria.opentuiKeyboardProps.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.opentuiKeyboardProps.resourceKey=src/shared/ui/KeyboardHelp.tsx
sonar.issue.ignore.multicriteria.opentuiAgentSelectorProps.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.opentuiAgentSelectorProps.resourceKey=src/widgets/agent-selector/AgentSelector.tsx
sonar.issue.ignore.multicriteria.opentuiDialogueListProps.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.opentuiDialogueListProps.resourceKey=src/widgets/dialogue-list/DialogueList.tsx
sonar.issue.ignore.multicriteria.opentuiAppScreenProps.ruleKey=typescript:S6747
