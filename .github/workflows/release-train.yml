name: Release train

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release transition to run.
        required: true
        type: choice
        options:
          - start-minor-alpha
          - alpha-bump
      dry_run:
        description: Compute and validate the release without writing refs.
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.repository }}-release-operations
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require an allowed transition ref and release credentials for write mode
        env:
          ACTION: ${{ inputs.action }}
          DISPATCH_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BOT_CLIENT_ID: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY" != "revisium/revo-tui" ]]; then
            echo "Release train is restricted to revisium/revo-tui." >&2
            exit 1
          fi
          case "$ACTION" in
            start-minor-alpha)
              EXPECTED_REF="refs/heads/master"
              ;;
            alpha-bump)
              EXPECTED_REF="refs/heads/release/0.1.x"
              ;;
            *)
              echo "Unsupported release transition: $ACTION" >&2
              exit 1
              ;;
          esac
          if [[ "$DISPATCH_REF" != "$EXPECTED_REF" ]]; then
            echo "Transition $ACTION must be dispatched from $EXPECTED_REF (got $DISPATCH_REF)." >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
            echo "dry_run must be true or false." >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && ( -z "$RELEASE_BOT_CLIENT_ID" || -z "$RELEASE_BOT_PRIVATE_KEY" ) ]]; then
            echo "Write mode requires RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY." >&2
            exit 1
          fi

  release-train:
    needs: guard
    uses: revisium/revisium-actions/.github/workflows/release-train.yml@6f243e6b395abc914c4427d204ffad7822a8e9e3
    with:
      action: ${{ inputs.action }}
      dry_run: ${{ inputs.dry_run }}
      base_branch: master
      node_version: 26.8.2
      package_manager: pnpm
      package_path: package.json
      install_command: pnpm install --frozen-lockfile
      validate_command: pnpm verify
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
