name: Release train

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release transition to run.
        required: true
        type: choice
        options:
          - start-minor-alpha
      dry_run:
        description: Compute and validate the release without writing refs.
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.repository }}-release-operations
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require master and release credentials for write mode
        env:
          ACTION: ${{ inputs.action }}
          DISPATCH_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BOT_CLIENT_ID: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY" != "revisium/revo-tui" ]]; then
            echo "Release train is restricted to revisium/revo-tui." >&2
            exit 1
          fi
          if [[ "$DISPATCH_REF" != "refs/heads/master" ]]; then
            echo "Release train must be dispatched from master." >&2
            exit 1
          fi
          if [[ "$ACTION" != "start-minor-alpha" ]]; then
            echo "Only start-minor-alpha is enabled in this initial release workflow." >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
            echo "dry_run must be true or false." >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && ( -z "$RELEASE_BOT_CLIENT_ID" || -z "$RELEASE_BOT_PRIVATE_KEY" ) ]]; then
            echo "Write mode requires RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY." >&2
            exit 1
          fi

      - name: Require npm publish token for write mode
        if: ${{ inputs.dry_run == false }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "Write mode requires NPM_TOKEN for the tag-triggered publisher." >&2
            exit 1
          fi

      - name: Set up Node.js for npm authentication preflight
        if: ${{ inputs.dry_run == false }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          registry-url: https://registry.npmjs.org

      - name: Verify npm token authentication
        if: ${{ inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if ! npm whoami --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=15000 >/dev/null 2>&1; then
            echo "NPM_TOKEN authentication failed against the npm registry." >&2
            exit 1
          fi
          echo "NPM_TOKEN authentication succeeded. Package publish permission still requires administrator confirmation."

  release-train:
    needs: guard
    uses: revisium/revisium-actions/.github/workflows/release-train.yml@6f243e6b395abc914c4427d204ffad7822a8e9e3
    with:
      action: ${{ inputs.action }}
      dry_run: ${{ inputs.dry_run }}
      base_branch: master
      node_version: 26.8.2
      package_manager: pnpm
      package_path: package.json
      install_command: pnpm install --frozen-lockfile
      validate_command: pnpm verify
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
